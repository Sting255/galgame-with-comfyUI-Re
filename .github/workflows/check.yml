name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: |
            agent-core/package-lock.json
            web-ui/package-lock.json
      # 2026-11-08：`npm ci --prefix agent-core` 在 windows-latest 上编 better-sqlite3 时失败
      # （runner 镜像升到 VS 18，node-gyp 解析其版本号失败 → "unknown version \"undefined\" found at
      #  C:\Program Files\Microsoft Visual Studio\18\Enterprise" → "Could not find any Visual Studio"）。
      # 2026-11-08 06:44 那次还是绿的：同一份 lockfile，纯粹是 runner 镜像在当天变了。
      # 这一步只跑静态检查（文档清单 / 未定义符号 / lint / 构建），用不到原生绑定，
      # 所以跳过 install scripts —— 别让 runner 镜像波动把检查卡红。
      - run: npm ci --prefix agent-core --ignore-scripts
      - run: npm ci --prefix web-ui
      - name: Documentation and source inventory
        run: npm run check
      # 2026-11-09（方案 A12）：CI 原来只跑文档清单，而 check.yml 自己的注释写着
      # 「未定义符号检查」——实际从没调用过 scripts/check-imports.mjs。
      # 这项检查在发布脚本里是有的，于是出现「本地打包会拦、CI 一路绿」的落差。
      - name: Undefined symbol check
        run: node scripts/check-imports.mjs
      - name: Frontend lint
        run: npm --prefix web-ui run lint
      - name: Production build
        run: npm --prefix web-ui run build
